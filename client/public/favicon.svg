<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3c35" />
      <stop offset="100%" stop-color="#06221e" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b48608" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" />
  
  <!-- Outer Gold Ring -->
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.75" stroke-dasharray="120 4" opacity="0.9" />

  <!-- DK Monogram & Ayurvedic Accent -->
  <g filter="url(#glow)">
    <!-- Letter D -->
    <path 
      d="M17 20 L24.5 20 C29.5 20 33 24.5 33 32 C33 39.5 29.5 44 24.5 44 L17 44 Z M21.5 24.5 L21.5 39.5 L24.2 39.5 C27 39.5 28.8 36.5 28.8 32 C28.8 27.5 27 24.5 24.2 24.5 Z" 
      fill="url(#goldGrad)" 
    />

    <!-- Letter K -->
    <path 
      d="M33 20 L37.5 20 L37.5 30 L43.5 20 L49 20 L41.8 31 L49 44 L43.5 44 L37.5 33 L37.5 44 L33 44 Z" 
      fill="#ffffff" 
    />

    <!-- Ayurvedic Golden Leaf on Top of K -->
    <path 
      d="M44 19 C44 14 39 12 36 14 C35 17 38 21 44 19 Z" 
      fill="url(#goldGrad)" 
    />
    <circle cx="37.5" cy="14" r="1" fill="#34d399" />
  </g>
</svg>